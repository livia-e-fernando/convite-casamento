<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lívia e Fernando</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;

  background: #efede5;

  font-family: Georgia, "Times New Roman", serif;
}

/* ÁREA GERAL */

.scene {
  width: min(90vw, 520px);
  height: min(90vh, 700px);

  display: flex;
  justify-content: center;
  align-items: center;

  perspective: 1200px;
}

/* CONJUNTO DO ENVELOPE */

.envelope-wrapper {
  position: relative;

  width: 420px;
  max-width: 88vw;
  aspect-ratio: 1.388 / 1;

  cursor: pointer;

  transition:
    transform 1s ease;
}

/* FUNDO DO ENVELOPE */

.envelope-back {
  position: absolute;
  inset: 0;

  background: #66705a;

  border-radius: 3px;

  box-shadow:
    0 20px 50px rgba(0,0,0,.18);

  z-index: 1;
}

/* PARTE DA FRENTE DO ENVELOPE */

.envelope-front {
  position: absolute;
  inset: 0;

  z-index: 4;

  overflow: hidden;

  pointer-events: none;
}

/* TRIÂNGULO ESQUERDO */

.envelope-front::before {
  content: "";

  position: absolute;

  left: 0;
  bottom: 0;

  width: 0;
  height: 0;

  border-left: 210px solid #737d66;
  border-top: 135px solid transparent;
}

/* TRIÂNGULO DIREITO */

.envelope-front::after {
  content: "";

  position: absolute;

  right: 0;
  bottom: 0;

  width: 0;
  height: 0;

  border-right: 210px solid #737d66;
  border-top: 135px solid transparent;
}

/* PARTE INFERIOR */

.bottom-fold {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 55%;

  background: #7c866f;

  clip-path: polygon(
    0 100%,
    50% 20%,
    100% 100%
  );

  z-index: 5;

  pointer-events: none;
}

/* ABA SUPERIOR */

.flap {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 59.3%;

  background: #59634e;

  clip-path: polygon(
    0 0,
    100% 0,
    50% 100%
  );

  transform-origin: top center;

  transform: rotateX(0deg);

  transition:
    transform 1s ease,
    z-index 0s linear 1s;

  z-index: 6;

  pointer-events: none;

  backface-visibility: visible;
}

  .rect-flap {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  z-index: 4;

  transform-origin: bottom center;

  transform: rotateX(0deg);

  transition:
    transform 1s ease 1s;

  transform-style: preserve-3d;

    background: #66705a;
}

/* TEXTO "TOQUE" */

.tap-message {
  position: absolute;

  left: 50%;
  bottom: -55px;

  transform: translateX(-50%);

  color: #666;

  font-family: Arial, sans-serif;
  font-size: 13px;

  letter-spacing: 2px;

  white-space: nowrap;

  transition: opacity .4s ease;
}

/* SELO */

.seal {
  position: absolute;

  left: 50%;
  top: 54%;

  transform: translate(-50%, -50%);

  width: 100px;
  height: 100px;

  border-radius: 50%;

  background: #364332;

  color: #eee9dc;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 17px;
  font-style: italic;

  z-index: 7;

  box-shadow:
    0 4px 10px rgba(0,0,0,.25);

  transition:
    opacity .35s ease,
    transform .4s ease;

  pointer-events: none;
}


/* =========================
   ENVELOPE ABERTO
   ========================= */

.envelope-wrapper.open .flap {
  transform: rotateX(180deg);
  z-index: 0;
}

  .envelope-wrapper.open .rect-flap {
  transform: rotateX(-180deg);
}

.envelope-wrapper.open .seal {
  opacity: 0;

  transform:
    translate(-50%, -50%)
    scale(.7);
}

.envelope-wrapper.open .tap-message {
  opacity: 0;
}


/* CELULAR */

@media (max-width: 500px) {

  .envelope-front::before {
    border-left-width: 44vw;
    border-top-width: 28vw;
  }

  .envelope-front::after {
    border-right-width: 44vw;
    border-top-width: 28vw;
  }

}

</style>
</head>


<body>

<div class="scene">

  <div
    class="envelope-wrapper"
    id="envelope"
    role="button"
    tabindex="0"
    aria-label="Abrir convite"
  >

    <div class="envelope-back">

      <div class="convite">
        <h1>Lívia e Fernando</h1>
        <p>texto do convite...</p>
      </div>

    </div>

      <div class="flap"></div>

      <div class="rect-flap"></div>

    <div class="seal">
      LiFe
    </div>

  </div>

</div>


<script>

const envelope = document.getElementById("envelope");

function abrirConvite() {

  if (!envelope.classList.contains("open")) {

    envelope.classList.add("open");

  }

}

envelope.addEventListener("click", abrirConvite);

envelope.addEventListener("keydown", function(event) {

  if (event.key === "Enter" || event.key === " ") {

    abrirConvite();

  }

});

</script>

</body>
</html>
